<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Can AI Calibrate an Unseen CO2 Isotopologue?</title>
<style>
  /* ================= DESIGN TOKENS (offline; system fonts only) ================= */
  :root{
    --bg:#0a1626; --bg2:#102138; --bg3:#16304f;
    --paper:#eef3f6; --ink:#0e1a2b; --ink-dim:#54677d;
    --text:#eef4f8; --dim:#93abc2; --dim2:#5a6e84;
    --accent:#53c8f0;      /* interface accent */
    --ames:#f2a95c;        /* Ames-2021 */
    --cdsd:#8fb8f0;        /* CDSD-296 */
    --gold:#f2c14e;        /* mean baseline */
    --marvel:#e88fd0;      /* MARVEL empirical */
    --ml:#5fe8b0;          /* ML residual */
    --withheld:#f07862;    /* withheld chamber */
    --line:rgba(238,243,246,.10); --line-strong:rgba(238,243,246,.28);
    --font-ui:system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-mono:ui-monospace, 'SF Mono', 'Cascadia Mono', 'Segoe UI Mono', Consolas, Menlo, monospace;
  }
  *{ box-sizing:border-box; }
  html, body{ height:100%; }
  body{
    margin:0; color:var(--text); font-family:var(--font-ui); font-size:16px; line-height:1.6;
    -webkit-font-smoothing:antialiased; background-color:var(--bg);
    background-image:linear-gradient(var(--line) 1px, transparent 1px),
                     linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:36px 36px;
    display:flex; flex-direction:column; min-height:100vh; overflow-x:hidden;
  }
  h1,h2{ font-weight:700; margin:0; letter-spacing:-.01em; }
  p{ margin:0; }
  button{ font-family:inherit; cursor:pointer; font-size:1rem; }
  :focus-visible{ outline:3px solid var(--accent); outline-offset:3px; }
  sub{ font-size:.72em; } sup{ font-size:.72em; }
  .mono{ font-family:var(--font-mono); }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }

  /* ================= FRAME ================= */
  .top-bar{ flex:0 0 auto; display:flex; justify-content:space-between; align-items:center; padding:14px 22px; gap:12px; }
  .brand{ font-size:.78rem; letter-spacing:.14em; text-transform:uppercase; color:var(--dim2); font-family:var(--font-mono); }
  .brand b{ color:var(--accent); font-weight:600; }
  .top-controls{ display:flex; gap:.6rem; align-items:center; }
  .restart-btn{ font-size:.8rem; padding:.45rem .9rem; border:1.5px solid var(--line-strong); background:transparent; color:var(--dim); text-transform:uppercase; letter-spacing:.05em; }
  .restart-btn:hover{ border-color:var(--accent); color:var(--text); }
  .progress-dots{ display:flex; gap:6px; }
  .progress-dots span{ width:7px; height:7px; border-radius:50%; background:var(--line-strong); transition:background .3s, transform .3s; }
  .progress-dots span.is-active{ background:var(--accent); transform:scale(1.35); }
  .progress-dots span.is-done{ background:var(--ml); }

  .stage-outer{ flex:1 1 auto; position:relative; overflow:hidden; display:flex; align-items:flex-start; justify-content:center; padding:8px 18px 22px; min-height:0; overflow-y:auto; }
  .stage-inner{ width:100%; max-width:900px; transition:transform .5s cubic-bezier(.4,0,.2,1), opacity .42s ease; }
  .stage-inner.is-exiting{ transform:translateX(-70px); opacity:0; }
  .stage-inner.is-entering{ transform:translateX(70px); opacity:0; }

  /* dev error panel (runtime validation failures) */
  .dev-error{ position:fixed; inset:auto 0 0 0; background:#5a1010; color:#ffdede; font-family:var(--font-mono); font-size:.85rem; padding:.9rem 1.2rem; z-index:99; display:none; }
  .dev-error.is-visible{ display:block; }

  /* ================= SHARED ================= */
  .iso-tag{ font-size:.85rem; color:var(--dim); text-align:center; margin-bottom:1.2rem; letter-spacing:.03em; font-family:var(--font-mono); }
  .iso-tag strong{ color:var(--accent); font-size:1rem; }
  .scene-tag{ font-size:.75rem; letter-spacing:.15em; text-align:center; color:var(--accent); margin-bottom:.5rem; text-transform:uppercase; font-family:var(--font-mono); }
  .scene-title{ font-size:clamp(1.35rem,3.2vw,1.9rem); text-align:center; margin-bottom:1.1rem; }
  .scene-msg{ text-align:center; color:var(--dim); font-size:1rem; max-width:54ch; margin:0 auto 1.3rem; line-height:1.65; }
  .scene-msg strong{ color:var(--text); }
  .fine{ font-size:.8rem; text-align:center; color:var(--dim); border:1px dashed var(--line-strong); padding:.6rem .9rem; margin:.9rem auto 0; max-width:62ch; line-height:1.55; }
  .btn{ display:inline-block; letter-spacing:.05em; padding:.85rem 1.8rem; border:none; background:var(--accent); color:var(--bg); font-weight:700; text-transform:uppercase; min-height:48px; }
  .btn-ghost{ background:transparent; border:1.5px solid var(--line-strong); color:var(--text); font-weight:600; }
  .btn-ghost:hover{ border-color:var(--accent); }
  .btn-row{ display:flex; gap:.8rem; justify-content:center; flex-wrap:wrap; margin-top:1.4rem; }

  /* ================= SCENE 1 ================= */
  .open-wrap{ text-align:center; padding:2rem 0 1rem; }
  .co2-svg{ width:min(320px,66vw); height:auto; margin:0 auto 1.4rem; display:block; }
  .co2-svg .atom-o{ fill:var(--withheld); } .co2-svg .atom-c{ fill:var(--dim); }
  .co2-svg .bond{ stroke:var(--line-strong); stroke-width:3; }
  .co2-svg text{ fill:var(--dim); font-family:var(--font-mono); font-size:12px; }
  @keyframes stR{ 0%,100%{ transform:translateX(0);} 50%{ transform:translateX(6px);} }
  @keyframes stL{ 0%,100%{ transform:translateX(0);} 50%{ transform:translateX(-6px);} }
  .co2-svg .o-r{ animation:stR 4.5s ease-in-out infinite; }
  .co2-svg .o-l{ animation:stL 4.5s ease-in-out infinite; }
  .open-title{ font-size:clamp(1.6rem,4.4vw,2.4rem); max-width:40ch; margin:0 auto 1rem; }
  .open-sub{ color:var(--dim); font-size:1.05rem; max-width:46ch; margin:0 auto 1.7rem; line-height:1.7; }

  /* ================= SCENE 2 — POOL ================= */
  .pool{ display:grid; grid-template-columns:repeat(auto-fill, minmax(120px,1fr)); gap:.8rem; max-width:660px; margin:0 auto 1rem; }
  .token{
    display:flex; flex-direction:column; align-items:center; gap:.35rem;
    padding:.85rem .5rem .7rem; border:2px solid var(--line-strong); background:var(--bg2);
    color:var(--text); transition:border-color .18s, transform .18s; min-height:86px;
  }
  .token:hover{ border-color:var(--accent); transform:translateY(-2px); }
  .token.is-selected{ border-color:var(--accent); background:var(--bg3); }
  .token.is-visited{ border-style:dashed; border-color:var(--ml); }
  .token .code{ font-family:var(--font-mono); font-weight:700; font-size:1.05rem; }
  .token svg{ width:56px; height:16px; }
  .token .t-o{ fill:var(--withheld); } .token .t-c{ fill:var(--dim); } .token .t-b{ stroke:var(--line-strong); stroke-width:1.5; }
  .confirm-line{ text-align:center; font-size:1rem; min-height:1.7em; margin-bottom:.2rem; }
  .confirm-line b{ color:var(--accent); }

  /* ================= SCENE 3 — REMOVAL ================= */
  .removal-svg{ width:min(640px,94vw); height:auto; display:block; margin:0 auto .8rem; }
  .removal-svg .pool-tile rect{ fill:var(--bg2); stroke:var(--line-strong); stroke-width:1.4; }
  .removal-svg .pool-tile text{ fill:var(--dim); font-family:var(--font-mono); font-size:11px; }
  .removal-svg .sel-tile rect{ fill:var(--bg3); stroke:var(--accent); stroke-width:2; }
  .removal-svg .sel-tile text{ fill:var(--text); font-family:var(--font-mono); font-size:11px; font-weight:700; }
  .removal-svg .chamber{ fill:none; stroke:var(--withheld); stroke-width:2; stroke-dasharray:6 5; }
  .removal-svg .chamber-label{ fill:var(--withheld); font-family:var(--font-mono); font-size:11px; font-weight:700; }
  .removal-svg .arm{ stroke:var(--dim); stroke-width:5; stroke-linecap:round; fill:none; }
  .removal-svg .arm-claw{ stroke:var(--accent); stroke-width:3; fill:none; stroke-linecap:round; }
  .arm-group, .carried{ transition:transform 1.6s cubic-bezier(.4,0,.2,1); }

  /* ================= SCENE 4 — TRAINING ================= */
  .train-svg{ width:min(620px,94vw); height:auto; display:block; margin:0 auto .6rem; }
  .train-svg .tt rect{ fill:var(--bg2); stroke:var(--line-strong); stroke-width:1.2; }
  .train-svg .tt text{ fill:var(--dim); font-family:var(--font-mono); font-size:10px; }
  .train-svg .chamber{ fill:none; stroke:var(--accent); stroke-width:1.6; }
  .train-svg .chamber-label{ fill:var(--accent); font-family:var(--font-mono); font-size:11px; }
  .train-svg .flow{ stroke:var(--accent); stroke-width:1.3; fill:none; stroke-dasharray:4 6; animation:fdash 1.3s linear infinite; opacity:.6; }
  @keyframes fdash{ to{ stroke-dashoffset:-20; } }
  .record-strip{ font-family:var(--font-mono); font-size:.85rem; text-align:center; color:var(--dim); border:1px solid var(--line-strong); padding:.6rem .8rem; max-width:560px; margin:0 auto .9rem; overflow-x:hidden; }
  .eq-line{ text-align:center; font-family:var(--font-mono); font-size:clamp(.9rem,2.4vw,1.05rem); margin:.35rem 0; }
  .eq-line .hl{ color:var(--gold); }
  .eq-line .hl2{ color:var(--marvel); }

  /* ================= SCENE 5 — FEATURES ================= */
  .feat-group-title{ text-align:center; font-size:1.05rem; margin:.6rem 0 .9rem; color:var(--text); }
  .feat-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:.7rem; max-width:700px; margin:0 auto 1rem; }
  .feat-card{ border:1.5px solid var(--line-strong); padding:.8rem .9rem; }
  .feat-card .sym{ font-family:var(--font-mono); font-weight:700; font-size:1.05rem; color:var(--accent); }
  .feat-card .desc{ font-size:.88rem; color:var(--dim); line-height:1.5; }
  .feat-card.diag .sym{ color:var(--gold); }
  .mode-svg{ width:200px; height:52px; display:block; margin:.6rem auto 0; }
  .mode-svg .m-o{ fill:var(--withheld); } .mode-svg .m-c{ fill:var(--dim); } .mode-svg .m-b{ stroke:var(--line-strong); stroke-width:2; }
  @keyframes m1r{ 0%,100%{transform:translateX(0);} 50%{transform:translateX(5px);} }
  @keyframes m1l{ 0%,100%{transform:translateX(0);} 50%{transform:translateX(-5px);} }
  @keyframes m2{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }
  @keyframes m3r{ 0%,100%{transform:translateX(0);} 50%{transform:translateX(5px);} }
  @keyframes m3l{ 0%,100%{transform:translateX(0);} 50%{transform:translateX(2px);} }
  .mode-v1 .mo-l{ animation:m1l 2.6s ease-in-out infinite; } .mode-v1 .mo-r{ animation:m1r 2.6s ease-in-out infinite; }
  .mode-v2 .mo-c{ animation:m2 2.6s ease-in-out infinite; }
  .mode-v3 .mo-l{ animation:m3l 2.6s ease-in-out infinite; } .mode-v3 .mo-r{ animation:m3r 2.6s ease-in-out infinite; }

  /* ================= SCENE 6 — TREE JOURNEY ================= */
  .tj-layout{ display:grid; grid-template-columns:1fr; gap:.6rem; }
  .tj-intro{ text-align:center; font-size:1rem; color:var(--text); min-height:1.7em; }
  .tj-intro .tno{ color:var(--accent); font-family:var(--font-mono); }
  .tree-svg{ width:min(680px,94vw); height:auto; display:block; margin:0 auto; }
  .tree-svg .e{ stroke:var(--line-strong); stroke-width:2; transition:stroke .4s, opacity .4s; }
  .tree-svg .e.on{ stroke:var(--accent); stroke-width:3.4; }
  .tree-svg .e.off{ opacity:.15; }
  .tree-svg .n rect{ fill:var(--bg2); stroke:var(--line-strong); stroke-width:1.5; transition:stroke .35s, opacity .4s; }
  .tree-svg .n text{ fill:var(--text); font-family:var(--font-mono); font-size:12.5px; }
  .tree-svg .n.on rect{ stroke:var(--accent); stroke-width:2.2; }
  .tree-svg .n.off{ opacity:.15; }
  .tree-svg .lf rect{ fill:var(--bg2); stroke:var(--line-strong); stroke-width:1.5; transition:fill .4s, stroke .4s, opacity .4s; }
  .tree-svg .lf text{ fill:var(--dim); font-family:var(--font-mono); font-size:12px; font-weight:700; }
  .tree-svg .lf.on rect{ fill:var(--ml); stroke:var(--ml); }
  .tree-svg .lf.on text{ fill:var(--bg); }
  .tree-svg .lf.off{ opacity:.15; }
  .tj-featval{ text-align:center; font-family:var(--font-mono); font-size:.95rem; color:var(--gold); min-height:1.6em; }
  .accum{ max-width:520px; margin:.7rem auto 0; border:2px solid var(--line-strong); padding:.9rem 1.2rem; text-align:center; }
  .accum .lbl{ font-size:.78rem; text-transform:uppercase; letter-spacing:.1em; color:var(--dim2); font-family:var(--font-mono); }
  .accum .val{ font-family:var(--font-mono); font-size:clamp(1.2rem,3.4vw,1.6rem); font-weight:700; color:var(--ml); }
  .accum .sub{ font-size:.78rem; color:var(--dim); font-family:var(--font-mono); }
  .tj-controls{ display:flex; gap:.6rem; justify-content:center; flex-wrap:wrap; margin-top:1rem; }
  .tj-controls .btn, .tj-controls .btn-ghost{ min-height:46px; padding:.6rem 1.1rem; font-size:.88rem; }

  /* ================= SCENES 7–9 ================= */
  .three-cols{ display:grid; grid-template-columns:repeat(auto-fit, minmax(170px,1fr)); gap:.8rem; max-width:680px; margin:0 auto 1rem; }
  .col-box{ border:2px solid var(--line-strong); padding:.9rem .7rem; text-align:center; }
  .col-box .lbl{ font-size:.72rem; color:var(--dim2); text-transform:uppercase; letter-spacing:.06em; display:block; margin-bottom:.3rem; font-family:var(--font-mono); }
  .col-box .val{ font-family:var(--font-mono); font-size:1.02rem; font-weight:700; }
  .col-box.mean{ border-color:var(--gold); } .col-box.corr{ border-color:var(--accent); }
  .col-box.final{ border-color:var(--ml); } .col-box.marv{ border-color:var(--marvel); }
  .headline-swap{ text-align:center; font-size:1.12rem; margin-bottom:1rem; font-family:var(--font-mono); }
  .headline-swap .arrow{ color:var(--dim); margin:0 .45rem; }
  .headline-swap .after{ color:var(--ml); font-weight:700; }
  .mae-chart{ background:var(--paper); padding:1.4rem 1rem .4rem; margin-bottom:.3rem; }
  .mae-bars{ display:flex; gap:.8rem; justify-content:space-around; }
  .mae-bar{ display:flex; flex-direction:column; align-items:center; flex:1 1 0; min-width:0; }
  .mae-bar-value{ font-family:var(--font-mono); font-size:.78rem; color:var(--ink); margin-bottom:.3rem; white-space:nowrap; }
  .mae-bar-track{ position:relative; width:min(32px,58%); height:128px; }
  .mae-bar-fill{ position:absolute; bottom:0; left:0; width:100%; height:0; background:var(--c); transition:height .9s cubic-bezier(.16,.8,.24,1); min-height:3px; }
  .mae-bar-label{ font-size:.74rem; color:var(--ink-dim); margin-top:.4rem; text-align:center; }
  .scale-note{ text-align:center; font-size:.74rem; color:var(--ink-dim); padding-bottom:.7rem; background:var(--paper); margin:0 0 1rem; }
  .bonus-stats{ display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:.7rem; margin-bottom:.9rem; }
  .bonus-stat{ text-align:center; border:1px solid var(--line); padding:.7rem .5rem; }
  .bonus-stat .big{ font-family:var(--font-mono); font-size:1.02rem; color:var(--text); display:block; font-weight:700; }
  .bonus-stat .small{ font-size:.85rem; color:var(--dim); }
  .claim{ text-align:center; font-size:1rem; color:var(--text); margin-bottom:.5rem; }

  /* ================= SCENE 10 ================= */
  .cmp-rows{ max-width:660px; margin:0 auto 1rem; }
  .cmp-row{ display:grid; grid-template-columns:46px 1fr 56px; align-items:center; gap:.7rem; padding:.44rem 0; border-bottom:1px solid var(--line); }
  .cmp-row:last-child{ border-bottom:none; }
  .cmp-iso{ font-family:var(--font-mono); font-size:.88rem; font-weight:700; }
  .cmp-iso.is-visited{ color:var(--ml); }
  .cmp-track{ position:relative; height:10px; background:var(--line); border-radius:5px; }
  .cmp-conn{ position:absolute; top:50%; height:2px; background:var(--dim2); transform:translateY(-50%); }
  .cmp-dot{ position:absolute; top:50%; width:9px; height:9px; border-radius:50%; transform:translate(-50%,-50%); }
  .cmp-dot.b{ background:var(--gold); } .cmp-dot.a{ background:var(--ml); }
  .cmp-factor{ font-family:var(--font-mono); font-size:.82rem; color:var(--ml); text-align:right; font-weight:600; }
  .cmp-legend{ text-align:center; font-size:.78rem; color:var(--dim2); margin-bottom:.5rem; }
  .cmp-legend i{ display:inline-block; width:8px; height:8px; border-radius:50%; margin:0 .3rem 0 1rem; }
  .tech{ max-width:680px; margin:0 auto; text-align:left; font-size:.9rem; color:var(--dim); line-height:1.7; }
  .tech h3{ color:var(--text); font-size:1rem; margin:1.1rem 0 .3rem; }
  .tech table{ border-collapse:collapse; font-family:var(--font-mono); font-size:.82rem; margin:.4rem 0; }
  .tech td{ border:1px solid var(--line-strong); padding:.3rem .6rem; }

  @media (max-width:600px){
    .top-bar{ padding:10px 12px; flex-wrap:wrap; }
    .stage-outer{ padding:4px 12px 14px; }
  }
</style>
</head>
<body>

<header class="top-bar">
  <span class="brand">HRMS PRAHA2026 · <b>LOIO Experiment</b></span>
  <div class="top-controls">
    <nav class="progress-dots" id="progressDots" aria-label="Progress"></nav>
    <button class="restart-btn" id="globalRestart" aria-label="Restart the experience">Restart</button>
  </div>
</header>

<main class="stage-outer">
  <div class="stage-inner" id="stageInner" aria-live="polite"></div>
</main>

<div class="dev-error" id="devError" role="alert"></div>

<script>
'use strict';
/* =====================================================================
   SECTION 1 — SCIENTIFIC DATA
   All numeric values verified against the manuscript and the authors'
   exported LOIO models (dump_model per fold) and results.csv.
   ===================================================================== */

// Fold-level LOIO results (manuscript Table: LOIO performance and expansion)
var LOIO_RESULTS = {
  '626': { Neval:7825,  Ninf:18729, exp:'3.4\u00d7',  mae:{ames:0.015332, cdsd:0.001515, mean:0.007713, ml:0.001706} },
  '627': { Neval:4845,  Ninf:45230, exp:'10.3\u00d7', mae:{ames:0.011709, cdsd:0.000792, mean:0.005933, ml:0.000841} },
  '628': { Neval:8762,  Ninf:43277, exp:'5.9\u00d7',  mae:{ames:0.021771, cdsd:0.001700, mean:0.011167, ml:0.001875} },
  '636': { Neval:6290,  Ninf:20761, exp:'4.3\u00d7',  mae:{ames:0.016172, cdsd:0.001637, mean:0.008339, ml:0.001909} },
  '637': { Neval:1960,  Ninf:48711, exp:'25.9\u00d7', mae:{ames:0.014276, cdsd:0.001122, mean:0.007098, ml:0.001228} },
  '638': { Neval:3900,  Ninf:48666, exp:'13.5\u00d7', mae:{ames:0.023345, cdsd:0.001618, mean:0.011936, ml:0.001735} },
  '727': { Neval:3277,  Ninf:46108, exp:'15.1\u00d7', mae:{ames:0.016741, cdsd:0.000725, mean:0.008419, ml:0.000821} },
  '728': { Neval:4318,  Ninf:46806, exp:'11.8\u00d7', mae:{ames:0.024244, cdsd:0.001023, mean:0.012108, ml:0.001133} },
  '737': { Neval:1639,  Ninf:61217, exp:'38.4\u00d7', mae:{ames:0.017357, cdsd:0.001366, mean:0.008751, ml:0.001438} },
  '738': { Neval:945,   Ninf:50571, exp:'54.5\u00d7', mae:{ames:0.029260, cdsd:0.001282, mean:0.014784, ml:0.001435} },
  '828': { Neval:5440,  Ninf:29245, exp:'6.4\u00d7',  mae:{ames:0.039465, cdsd:0.002224, mean:0.019327, ml:0.002749} },
  '838': { Neval:1057,  Ninf:26988, exp:'26.5\u00d7', mae:{ames:0.043829, cdsd:0.001152, mean:0.021997, ml:0.001510} }
};
var ISO_ORDER = ['626','627','628','636','637','638','727','728','737','738','828','838'];

// Feature definitions — ordering MUST match the trained model's feature_names
var FEATURE_NAMES = ['J','v1','v2','v3','r','p','theory_diff','theory_diff_abs'];
var FEATURE_DEFS = {
  J:  { sym:'J', group:'q', desc:'Rotational quantum number - rotational excitation.' },
  v1: { sym:'v\u2081', group:'q', desc:'Symmetric-stretch excitation.', mode:'v1' },
  v2: { sym:'v\u2082', group:'q', desc:'Bending-mode excitation.', mode:'v2' },
  v3: { sym:'v\u2083', group:'q', desc:'Asymmetric-stretch excitation.', mode:'v3' },
  r:  { sym:'r', group:'q', desc:'Fermi-ranking index - distinguishes states within the rovibrational structure.' },
  p:  { sym:'p', group:'q', desc:'Rotationless parity, encoded numerically.' },
  theory_diff:     { sym:'\u0394E<sub>cal</sub>', group:'d', desc:'Signed disagreement between CDSD-296 and Ames-2021.' },
  theory_diff_abs: { sym:'|\u0394E<sub>cal</sub>|', group:'d', desc:'Magnitude of the disagreement between the two calculated descriptions.' }
};

/* =====================================================================
   SECTION 2 — VALIDATION (runs at boot; failures render the dev panel)
   ===================================================================== */
function devError(msg){
  var p = document.getElementById('devError');
  p.textContent = 'VALIDATION FAILURE \u2014 do not present: ' + msg;
  p.classList.add('is-visible');
  throw new Error(msg);
}

// Re-traverse an embedded tree in JS with the state's features.
// Node ids: root=0, left=2i+1, right=2i+2. Split rule: value <= threshold -> left.
function traverseTree(nodes, x){
  var id = 0, path = [0];
  while (nodes[id].leaf === undefined){
    var n = nodes[id];
    id = (x[n.f] <= n.t) ? id * 2 + 1 : id * 2 + 2;
    path.push(id);
  }
  return { path: path, leaf: nodes[id].leaf };
}

function stateVector(s){
  return [s.J, s.v1, s.v2, s.v3, s.r, s.p, s.theory_diff, s.theory_diff_abs];
}

function validateAll(){
  ISO_ORDER.forEach(function(iso){
    var jd = JOURNEY[iso];
    if (!jd) devError('missing journey data for ' + iso);
    var s = jd.state;
    var x = stateVector(s);
    // (a) E_mean recomputes from EAmes/ECDSD
    if (Math.abs((s.EAmes + s.ECDSD) / 2 - s.Emean) > 1e-5) devError(iso + ': E_mean mismatch');
    // (b) theory_diff consistency
    if (Math.abs((s.ECDSD - s.EAmes) - s.theory_diff) > 1e-5) devError(iso + ': theory_diff mismatch');
    // (c) each embedded tree: JS traversal reproduces the recorded path and contribution
    var sum = 0;
    jd.trees.forEach(function(t, k){
      var r = traverseTree(t.nodes, x);
      if (Math.abs(r.leaf - t.contrib) > 1e-9) devError(iso + ': tree ' + t.idx + ' contribution mismatch');
      if (r.path.join(',') !== t.path.join(',')) devError(iso + ': tree ' + t.idx + ' path mismatch');
      sum += r.leaf;
    });
    // (d) contributions + remainder equal the model's exact prediction
    if (Math.abs(sum + jd.remainder - s.dPred) > 1e-9) devError(iso + ': sum+remainder != prediction');
    // (e) calibrated energy is consistent
    if (Math.abs((s.Emean + s.dPred) - (s.EMarvel - (s.EMarvel - s.Emean - s.dPred))) > 1e-9) devError(iso + ': E_hat algebra');
    if (Math.abs(Math.abs(s.EMarvel - (s.Emean + s.dPred)) - s.errML) > 1e-5) devError(iso + ': errML mismatch');
    // (f) fold aggregates sane
    var f = LOIO_RESULTS[iso];
    if (!(f.mae.ml < f.mae.mean)) devError(iso + ': fold aggregate ordering');
  });
}

var SCENES = ['open','pool','remove','train','features','trees','forward','apply','result','continue'];
var state = { scene:0, iso:null, visited:{}, timers:[], tj:null, pendingIso:null };
var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var stageInner = document.getElementById('stageInner');

function clearTimers(){ state.timers.forEach(clearTimeout); state.timers = []; }
function after(ms, fn){ state.timers.push(setTimeout(fn, REDUCED ? 0 : ms)); }

function setProgress(i){
  var d = document.getElementById('progressDots'); d.innerHTML = '';
  SCENES.forEach(function(_, k){
    var s = document.createElement('span');
    if (k < i) s.className = 'is-done'; else if (k === i) s.className = 'is-active';
    d.appendChild(s);
  });
}

function goTo(idx, buildFn){
  clearTimers();
  state.scene = idx;
  stageInner.classList.add('is-exiting');
  setTimeout(function(){
    stageInner.innerHTML = '';
    buildFn(stageInner);
    setProgress(idx);
    stageInner.classList.remove('is-exiting');
    stageInner.classList.add('is-entering');
    void stageInner.offsetWidth;
    stageInner.classList.remove('is-entering');
    document.querySelector('.stage-outer').scrollTop = 0;
  }, REDUCED ? 0 : 420);
}

function el(tag, cls, html){
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function isoComposition(code){
  function o(d){ return d === '6' ? '\u00b9\u2076O' : (d === '7' ? '\u00b9\u2077O' : '\u00b9\u2078O'); }
  function c(d){ return d === '2' ? '\u00b9\u00b2C' : '\u00b9\u00b3C'; }
  return o(code[0]) + '\u2013' + c(code[1]) + '\u2013' + o(code[2]);
}
function isoTag(){
  return el('p', 'iso-tag', 'ISOTOPOLOGUE <strong>' + state.iso + '</strong> (' + isoComposition(state.iso) + ') \u2014 WITHHELD');
}
function fmtS(v, dp){ dp = dp || 6; return (v >= 0 ? '+' : '\u2212') + Math.abs(v).toFixed(dp); }
function fmtP(v, dp){ dp = dp || 6; return (v >= 0 ? '' : '\u2212') + Math.abs(v).toFixed(dp); }

// Global fixed log scale for MAE comparisons
var ALLV = [];
ISO_ORDER.forEach(function(i){ var m = LOIO_RESULTS[i].mae; ALLV.push(m.ames, m.cdsd, m.mean, m.ml); });
var LMIN = Math.log10(Math.min.apply(null, ALLV)), LMAX = Math.log10(Math.max.apply(null, ALLV));
function gPct(v){ return 6 + ((Math.log10(v) - LMIN) / (LMAX - LMIN)) * 88; }

function scPool(t){

  var pool = el('div', 'pool'); pool.setAttribute('role', 'group'); pool.setAttribute('aria-label', 'Twelve CO2 isotopologues');

      '<line class="t-b" x1="12" y1="8" x2="24" y2="8"></line><line class="t-b" x1="32" y1="8" x2="44" y2="8"></line>' +

      okBtn.style.display = 'inline-block'; otherBtn.style.display = 'inline-block';
    });
    pool.appendChild(tk);
  });
  okBtn.addEventListener('click', function(){
    state.iso = state.pendingIso;
    state.tj = JOURNEY[state.iso];
    goTo(2, scRemove);
  });
  otherBtn.addEventListener('click', function(){

    okBtn.style.display = 'none'; otherBtn.style.display = 'none';

  btnRow.appendChild(okBtn); btnRow.appendChild(otherBtn);

/* =====================================================================
   Scene 6 — THE TREE JOURNEY (exact trees from the exported fold model)
   ===================================================================== */
function treeCategory(nodes){
  var f = nodes[0].f;
  return (f >= 6) ? 'a calculation-disagreement feature' : 'a quantum-state feature';
}

// Render a real tree (depth <= 3) with all nodes; ids follow root=0, L=2i+1, R=2i+2
function realTreeSVG(nodes){
  var W = 680, H = 268, DY = [26, 100, 172, 240];
  function depthOf(id){ var d = 0; while (id > 0){ id = Math.floor((id - 1) / 2); d++; } return d; }
  function xFor(id){
    var d = depthOf(id), posInLevel = id - (Math.pow(2, d) - 1);
    return (W / Math.pow(2, d)) * (posInLevel + 0.5);
  }
  var parts = [];
  Object.keys(nodes).map(Number).sort(function(a,b){ return a - b; }).forEach(function(id){
    if (id > 0){
      var pid = Math.floor((id - 1) / 2);
      parts.push('<line class="e" id="e' + id + '" x1="' + xFor(pid) + '" y1="' + (DY[depthOf(pid)] + 12) + '" x2="' + xFor(id) + '" y2="' + (DY[depthOf(id)] - 12) + '"></line>');
    }
  });
  Object.keys(nodes).map(Number).sort(function(a,b){ return a - b; }).forEach(function(id){
    var n = nodes[id], x = xFor(id), y = DY[depthOf(id)];
    if (n.leaf !== undefined){
      parts.push('<g class="lf" id="n' + id + '"><rect x="' + (x - 44) + '" y="' + (y - 12) + '" width="88" height="24" rx="2"></rect>' +
        '<text x="' + x + '" y="' + (y + 4.5) + '" text-anchor="middle">' + fmtS(n.leaf, 5) + '</text></g>');
    } else {
      var label = featSymSVG(n.f) + ' \u2264 ' + (+n.t).toPrecision(5);
      var wdt = Math.max(120, label.replace(/<[^>]+>/g,'').length * 8 + 22);
      parts.push('<g class="n" id="n' + id + '"><rect x="' + (x - wdt/2) + '" y="' + (y - 13) + '" width="' + wdt + '" height="26" rx="2"></rect>' +
        '<text x="' + x + '" y="' + (y + 4.5) + '" text-anchor="middle">' + label + '</text></g>');
    }
  });
  return '<svg class="tree-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Actual decision tree from the trained model">' + parts.join('') + '</svg>';
}

function scTrees(t){
  var jd = state.tj, s = jd.state;
  var x = stateVector(s);
  t.appendChild(isoTag());
  t.appendChild(el('h2', 'scene-title', 'How does LightGBM build the correction?'));

  var intro = el('p', 'tj-intro'); intro.id = 'tjIntro';
  var stageHolder = el('div'); stageHolder.id = 'tjStage';
  var featval = el('p', 'tj-featval'); featval.id = 'tjFeatval';
  var accum = el('div', 'accum');
  accum.innerHTML = '<span class="lbl">Sum of shown trees</span><br>' +
    '<span class="val" id="accumVal">+0.000000</span> <span class="sub">cm<sup>\u22121</sup></span><br>' +
    '<span class="sub" id="accumSub">0 of ' + jd.trees.length + ' representative trees added</span>';
  t.appendChild(intro); t.appendChild(stageHolder); t.appendChild(featval); t.appendChild(accum);



  var controls = el('div', 'tj-controls');
  var nextSplit = el('button', 'btn', 'Next split');
  var autoBtn = el('button', 'btn btn-ghost', 'Auto-play');
  var pauseBtn = el('button', 'btn btn-ghost', 'Pause');
  var skipBtn = el('button', 'btn btn-ghost', 'Skip to result');
  pauseBtn.style.display = 'none';
  controls.appendChild(nextSplit); controls.appendChild(autoBtn); controls.appendChild(pauseBtn); controls.appendChild(skipBtn);
  t.appendChild(controls);

  // ---- traversal machine ----
  var tj = { treeIdx:0, stepIdx:0, sum:0, auto:false, done:false };

  function loadTree(k){
    var tr = jd.trees[k];
    document.getElementById('tjStage').innerHTML = realTreeSVG(tr.nodes);
    var cat = treeCategory(tr.nodes);
    document.getElementById('tjIntro').innerHTML =
      'Tree <span class="tno">#' + tr.idx + '</span> of ' + jd.nTrees + ' checks ' + cat + '.';
    var rootF = tr.nodes[0].f;
    document.getElementById('tjFeatval').innerHTML =
      'This state\u2019s value: ' + featSym(rootF) + ' = ' + (+x[rootF]).toPrecision(6);
    tj.stepIdx = 0;
    // light the root
    var rootEl = document.getElementById('n0'); if (rootEl) rootEl.classList.add('on');
  }

  function stepOnce(){
    if (tj.done) return;
    var tr = jd.trees[tj.treeIdx];
    var path = tr.path;
    if (tj.stepIdx < path.length - 1){
      // advance one edge along the genuine path
      var from = path[tj.stepIdx], to = path[tj.stepIdx + 1];
      var eEl = document.getElementById('e' + to); if (eEl) eEl.classList.add('on');
      var nEl = document.getElementById('n' + to); if (nEl) nEl.classList.add('on');
      // dim the sibling subtree
      var sib = (to % 2 === 1) ? to + 1 : to - 1;
      dimSubtree(tr.nodes, sib);
      // if we just reached an internal node, show its feature value
      var reached = tr.nodes[to];
      if (reached && reached.leaf === undefined){
        document.getElementById('tjFeatval').innerHTML =
          'This state\u2019s value: ' + featSym(reached.f) + ' = ' + (+x[reached.f]).toPrecision(6);
      } else {
        document.getElementById('tjFeatval').innerHTML =
          'Tree contribution: <b style="color:var(--ml)">' + fmtS(tr.contrib) + ' cm<sup>\u22121</sup></b>';
      }
      tj.stepIdx++;
      if (tj.stepIdx === path.length - 1){
        // leaf reached: add to accumulator
        tj.sum = +(tj.sum + tr.contrib).toFixed(10);
        document.getElementById('accumVal').textContent = fmtS(tj.sum);
        document.getElementById('accumSub').textContent = (tj.treeIdx + 1) + ' of ' + jd.trees.length + ' representative trees added';
      }
    } else {
      // move to next tree or finish
      if (tj.treeIdx < jd.trees.length - 1){ tj.treeIdx++; loadTree(tj.treeIdx); }
      else { tj.done = true; goTo(6, scForward); return; }
    }
    if (tj.auto && !tj.done) after(1050, stepOnce);
  }

  function dimSubtree(nodes, id){
    if (nodes[id] === undefined) return;
    var e = document.getElementById('e' + id); if (e) e.classList.add('off');
    var n = document.getElementById('n' + id); if (n) n.classList.add('off');
    dimSubtree(nodes, id * 2 + 1); dimSubtree(nodes, id * 2 + 2);
  }

  nextSplit.addEventListener('click', function(){ tj.auto = false; pauseBtn.style.display = 'none'; autoBtn.style.display = 'inline-block'; stepOnce(); });
  autoBtn.addEventListener('click', function(){ tj.auto = true; autoBtn.style.display = 'none'; pauseBtn.style.display = 'inline-block'; stepOnce(); });
  pauseBtn.addEventListener('click', function(){ tj.auto = false; pauseBtn.style.display = 'none'; autoBtn.style.display = 'inline-block'; clearTimers(); });
  skipBtn.addEventListener('click', function(){ tj.done = true; clearTimers(); goTo(6, scForward); });

  loadTree(0);
  state.tjMachine = tj;
}

/* Scene 7 — fast-forward through the ensemble to the exact prediction */
function scForward(t){
  var jd = state.tj, s = jd.state;
  var shownSum = jd.trees.reduce(function(a, tr){ return a + tr.contrib; }, 0);
  var ehat = s.Emean + s.dPred;
  t.appendChild(isoTag());
  t.appendChild(el('h2', 'scene-title', 'The trained ensemble contains many more shallow trees.'));
  t.appendChild(el('p', 'scene-msg',
    'This fold used <strong>' + jd.bestIter.toLocaleString() + '</strong> boosting rounds (early stopping). ' +
    'Adding every remaining tree\u2019s contribution:'));

  var accum = el('div', 'accum');
  accum.innerHTML = '<span class="lbl">Predicted correction \u0394\u00ca</span><br>' +
    '<span class="val" id="fwVal">' + fmtS(shownSum) + '</span> <span class="sub">cm<sup>\u22121</sup></span><br>' +
    '<span class="sub" id="fwSub">' + jd.trees.length + ' shown trees</span>';
  t.appendChild(accum);

  var cols = el('div', 'three-cols'); cols.style.marginTop = '1.2rem';
  cols.appendChild(el('div', 'col-box mean', '<span class="lbl">Physics baseline E<sub>mean</sub></span><span class="val">' + fmtP(s.Emean) + '</span>'));
  cols.appendChild(el('div', 'col-box corr', '<span class="lbl">Learned residual \u0394\u00ca</span><span class="val" id="colDelta">\u2026</span>'));
  cols.appendChild(el('div', 'col-box final', '<span class="lbl">Final calibrated \u00ca</span><span class="val" id="colEhat">\u2026</span>'));
  t.appendChild(cols);

  var reveal = el('div'); reveal.id = 'marvelBlock'; reveal.style.opacity = '0'; reveal.style.transition = 'opacity .5s ease';
  var mc = el('div', 'three-cols');
  mc.appendChild(el('div', 'col-box marv', '<span class="lbl">Experiment E<sub>MARVEL</sub></span><span class="val">' + fmtP(s.EMarvel) + '</span>'));
  mc.appendChild(el('div', 'col-box', '<span class="lbl">|E<sub>MARVEL</sub> \u2212 \u00ca|</span><span class="val" style="color:var(--ml)">' + s.errML.toFixed(6) + '</span>'));
  mc.appendChild(el('div', 'col-box', '<span class="lbl">Baseline alone was off by</span><span class="val" style="color:var(--gold)">' + s.errBase.toFixed(6) + '</span>'));
  reveal.appendChild(mc);
  t.appendChild(reveal);

  var btnRow = el('div', 'btn-row');
  var b = el('button', 'btn', 'Apply the model to the withheld isotopologue');
  b.style.display = 'none';
  b.addEventListener('click', function(){ goTo(7, scApply); });
  btnRow.appendChild(b);
  t.appendChild(btnRow);

  // animate the remainder converging to the exact prediction, then reveal E_hat and MARVEL
  var steps = REDUCED ? 1 : 14, k = 0;
  function tick(){
    k++;
    var v = shownSum + jd.remainder * (k / steps);
    document.getElementById('fwVal').textContent = fmtS(v);
    document.getElementById('fwSub').textContent = k < steps ? '+ remaining ' + (jd.nTrees - jd.trees.length).toLocaleString() + ' trees\u2026' : 'all ' + jd.nTrees.toLocaleString() + ' trees combined';
    if (k < steps) after(120, tick);
    else {
      document.getElementById('fwVal').textContent = fmtS(s.dPred);
      document.getElementById('colDelta').textContent = fmtS(s.dPred);
      document.getElementById('colEhat').textContent = fmtP(ehat);
      after(500, function(){
        document.getElementById('marvelBlock').style.opacity = '1';
        b.style.display = 'inline-block';
      });
    }
  }
  after(500, tick);
}

    '<h3>Features</h3><p>Quantum-state structure: J, v\u2081, v\u2082, v\u2083, r, p. Theory-disagreement diagnostics: \u0394E<sub>cal</sub> = E<sub>CDSD</sub> \u2212 E<sub>Ames</sub> and |\u0394E<sub>cal</sub>|. Feature ordering matches the trained model exactly.</p>' +
    '<h3>Hyperparameters</h3><table>' + MODEL_META.map(function(m){ return '<tr><td>' + m[0] + '</td><td>' + m[1] + '</td></tr>'; }).join('') + '</table>' +
    '<h3>Objective</h3><p>Huber loss (\u03b1 = 0.90): quadratic for small residuals, linear beyond \u2014 robust to isolated large residuals. This is a training-time objective; inference is a deterministic sum of tree leaf values.</p>' +
    '<h3>Training vs. inference</h3><p>Weighting, the Huber objective, validation splitting and early stopping happen during training only. At inference each state simply traverses every tree and the leaf values are summed \u2014 exactly what this experience replays.</p>' +
    '<h3>Seed stability</h3><p>Across five independent seeds the overall weighted LOIO MAE is 0.001649 \u00b1 0.000030 cm\u207b\u00b9 (manuscript, Seed stability analysis).</p>' +
    '<h3>Feature importance</h3><p>The calculated-difference diagnostics collectively account for a substantial fraction of total gain; r and p contribute least but are retained for physical completeness (manuscript, Feature importance).</p>' +
    '<h3>Limitations</h3><p>The correction transfers less readily for heavy symmetric species (828, 838); the ML/CDSD ratio is largest there. The framework calibrates and flags outliers; it does not replace effective-Hamiltonian fits.</p>';
  x.appendChild(d);
}
